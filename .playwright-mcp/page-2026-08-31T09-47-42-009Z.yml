      - heading "todocoleccion, donde viven los recuerdos y la cultura del coleccionismo" [level=2] [ref=f2e1297]
      - paragraph [ref=f2e1298]: Somos la mayor comunidad online de compra venta y subastas de Antigüedades, Arte, Libros y Coleccionismo. Conectamos a las personas con su historia, vivencias y emociones mediante los objetos que veneran.
      - paragraph [ref=f2e1299]: En todocoleccion puedes comprar directamente o pujar en nuestras subastas por recuerdos que creíste no volver a ver. Libros antiguos y de segunda mano, juguetes antiguos, figuras de acción, muñecas antiguas, muebles de segunda mano, joyas de colección, objetos vintage, cromos de fútbol, monedas y sellos, relojes antiguos, discos de vinilo, arte religioso, postales, tebeos y cómics, películas, moda antigua, pintura al óleo, antigüedades técnicas y rústicas… Echa un vistazo a nuestro catálogo o utiliza nuestro buscador, ¡encuentra ese objeto único al que dar una nueva vida!
