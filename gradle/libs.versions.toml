# Version catalog — dependency pins per design.md D9 (migrate-to-native-android).
#
# Constraint reminder (design.md §9 API 22 audit): do NOT bump media3 past 1.2.x
# without enabling core library desugaring — media3 1.3.0+ requires desugaring and
# crashes on API 22 with NoSuchMethodError (androidx/media#1379). This build has
# desugaring explicitly off.

[versions]
agp = "8.5.2"
kotlin = "1.9.24"
media3 = "1.2.1"
androidxAppcompat = "1.6.1"
androidxFragment = "1.6.2"
androidxRecyclerview = "1.3.2"
androidxConstraintlayout = "2.1.4"
androidxCore = "1.12.0"
androidxMedia = "1.7.0"
junit = "4.13.2"

[plugins]
android-application = { id = "com.android.application", version.ref = "agp" }
kotlin-android = { id = "org.jetbrains.kotlin.android", version.ref = "kotlin" }

[libraries]
androidx-core = { group = "androidx.core", name = "core", version.ref = "androidxCore" }
androidx-appcompat = { group = "androidx.appcompat", name = "appcompat", version.ref = "androidxAppcompat" }
androidx-fragment = { group = "androidx.fragment", name = "fragment", version.ref = "androidxFragment" }
androidx-recyclerview = { group = "androidx.recyclerview", name = "recyclerview", version.ref = "androidxRecyclerview" }
androidx-constraintlayout = { group = "androidx.constraintlayout", name = "constraintlayout", version.ref = "androidxConstraintlayout" }
androidx-media = { group = "androidx.media", name = "media", version.ref = "androidxMedia" }
media3-exoplayer = { group = "androidx.media3", name = "media3-exoplayer", version.ref = "media3" }
media3-session = { group = "androidx.media3", name = "media3-session", version.ref = "media3" }
junit = { group = "junit", name = "junit", version.ref = "junit" }
